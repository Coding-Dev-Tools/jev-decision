name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mcp,setup]"

      - name: Run Pytest
        run: |
          python -m pytest tests/ -v

      - name: Check configured Python lint rules
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install ruff==0.16.9
          python -m ruff check .

      - name: Test CLI
        run: |
          jev --help
          jev doctor --json

      - name: Clean wheel and source installation
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python scripts/check_packages.py --output "${{ runner.temp }}/jev-artifacts"

      - name: Retain Python release candidates
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ matrix.os }}
          path: ${{ runner.temp }}/jev-artifacts/dist/*

  typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: ts
      - run: npm test
        working-directory: ts
      - run: npm run check:package
        working-directory: ts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ matrix.os }}-node${{ matrix.node-version }}
          path: ts/*.tgz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_parity.py tests/test_question_ids.py -q
