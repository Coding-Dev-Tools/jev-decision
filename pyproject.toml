[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decision"
version = "0.1.0"
description = "Zero-dependency System 1 decision client, calibration evaluator, and harness guardrails for Jev (TypeSafe AI)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Engraphis & Agent Ecosystem" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]
