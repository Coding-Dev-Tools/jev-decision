[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decision"
dynamic = ["version"]
description = "Budgeted advisory Jev decisions, protected credentials, evidence selection and multi-harness MCP integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=2,<3; python_version < '3.11'"]
authors = [{ name = "Coding-Dev-Tools & Agent Ecosystem" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
jev = "jev_decision.cli:main"
jev-mcp = "jev_decision.mcp:main"

[project.urls]
Repository = "https://github.com/Coding-Dev-Tools/jev-decision"
Documentation = "https://github.com/Coding-Dev-Tools/jev-decision#readme"
Issues = "https://github.com/Coding-Dev-Tools/jev-decision/issues"

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4,<5"]
mcp = ["mcp>=2.2,<3; python_version >= '3.10'"]
setup = ["keyring>=25,<26", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
include = ["jev_decision*"]

[tool.setuptools.dynamic]
version = { attr = "jev_decision._version.__version__" }

[tool.setuptools.package-data]
jev_decision = ["resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
